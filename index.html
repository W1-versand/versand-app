<script>
/* W1 Brücke: leitet die bisherigen Aufrufe (google.script.run) über das Internet an Apps Script weiter. */
(function(){
 const ADRESSE='https://script.google.com/macros/s/AKfycbziNwOuyBAAdyQFBeAtfjVG7XThhnt2rT0h3iDafmYGuLh_MSOKs2RAV7_dYhB1meWX/exec';
 function zugangscode(){
  let c=localStorage.getItem('w1_code')||'';
  if(!c){c=(prompt('Zugangscode eingeben:')||'').trim();if(c)localStorage.setItem('w1_code',c);}
  return c;
 }
 async function senden(fn,args){
  const code=zugangscode();
  if(!code)throw Error('Zugangscode fehlt.');
  let antwort;
  try{antwort=await fetch(ADRESSE,{method:'POST',body:JSON.stringify({code:code,fn:fn,args:args})}).then(r=>r.json());}
  catch(e){throw Error('Keine Verbindung zum Server.');}
  if(!antwort.ok){if(antwort.auth)localStorage.removeItem('w1_code');throw Error(antwort.error||'Fehler');}
  return antwort.result;
 }
 function laeufer(ok,fail){
  return new Proxy({},{get:(t,name)=>{
   if(name==='withSuccessHandler')return f=>laeufer(f,fail);
   if(name==='withFailureHandler')return f=>laeufer(ok,f);
   return (...args)=>{senden(name,args).then(v=>{if(ok)ok(v);}).catch(e=>{if(fail)fail(e);});};
  }});
 }
 window.google={script:{run:laeufer(null,null)}};
})();
</script>

function scan(canvas){const reader=new ZXingBrowser.BrowserMultiFormatReader();try{const result=reader.decodeFromCanvas(canvas);return result&&result.getText?result.getText():null;}catch(e){return null;}finally{if(reader.reset)reader.reset();}}

function kontrastDaten(id){const d=id.data;let lo=255,hi=0;for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;if(g<lo)lo=g;if(g>hi)hi=g;}const f=255/Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){const v=(d[i]-lo)*f;d[i]=d[i+1]=d[i+2]=v;}return id;}
async function findBarcodes(img){
 try{
  const {readBarcodes}=await zxwLaden();
  const W=img.naturalWidth,H=img.naturalHeight,f=Math.min(1,3300/Math.max(W,H)),w=Math.round(W*f),h=Math.round(H*f);

async function findBarcodesAlt(img){const results=[],add=s=>{if(s&&!results.includes(s))results.push(s);};const regions=[[0,0,1,1],[.10,.20,.78,.42],[.13,.34,.70,.21],[.13,.42,.72,.21],[.12,.55,.76,.30],[.18,.67,.66,.19],[.22,.37,.28,.12],[.48,.43,.31,.14],[.20,.72,.58,.13],[.19,.61,.49,.14]];let attempts=0;for(const contrast of [false,true]){const c=canvasFromImage(img,1,0,contrast);for(const [x,y,w,h] of regions){attempts++;status('Barcode-Suche: '+attempts+' Bereiche, '+results.length+' Code(s) gefunden …');add(scan(crop(c,x,y,w,h)));if(attempts%4===0)await new Promise(r=>setTimeout(r,0));}if(['H','Q','M','K'].every(p=>results.some(s=>s.toUpperCase().startsWith(p))))break;}if(!['H','Q','M','K'].every(p=>results.some(s=>s.toUpperCase().startsWith(p)))){for(const angle of [90,270]){const c=canvasFromImage(img,1,angle,false);add(scan(c));if(['H','Q','M','K'].every(p=>results.some(s=>s.toUpperCase().startsWith(p))))break;}}return results;}

function materialAusschnitt(img){
 const c=document.createElement('canvas');
 const max=2600, f=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const w=Math.round(img.naturalWidth*f),h=Math.round(img.naturalHeight*f);

 base.getContext('2d').drawImage(img,0,0,w,h);
 // Breiter Bereich um die obere Materialnummer, mit Reserve für schräge Fotos.
 return crop(base,.10,.23,.82,.29);
}
function kontrastCanvas(src){
 const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);

 for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];const v=Math.max(0,Math.min(255,(g-128)*1.65+145));d[i]=d[i+1]=d[i+2]=v;}
 x.putImageData(im,0,0);return c;
}

$('sammel').addEventListener('click',async()=>{try{const d=await call('w1SammelHeute');const z=d.zeilen||[];if(!z.length){await frage('Heute wurden noch keine Lieferscheine abgeschlossen.','OK');return;}
 const fmt=n=>Number(n).toLocaleString('de-DE'),dat=d.tag.slice(8,10)+'.'+d.tag.slice(5,7)+'.'+d.tag.slice(0,4);let gesamt=0;
 const teile=['5113','5125'].map(w=>{const t=z.filter(x=>x.werk===w);if(!t.length)return '';const sum=t.reduce((s,x)=>s+x.menge,0);gesamt+=sum;
  return '<h2 style="font-size:16px;margin:16px 0 4px">Werk '+w+' – '+(w==='5113'?'Wagenfeld':'Diepholz')+'</h2><table><thead><tr><th>Lieferschein</th><th>Materialnummer</th><th>Bezeichnung</th><th>Rahmenvertrag</th><th class="num">Menge</th></tr></thead><tbody>'+t.map(x=>'<tr><td>'+esc(x.nr)+'</td><td>'+esc(x.material)+'</td><td>'+esc(x.bezeichnung)+'</td><td>'+esc(x.vertrag)+'</td><td class="num">'+fmt(x.menge)+'</td></tr>').join('')+'</tbody><tfoot><tr><th colspan="4">Summe Werk '+w+'</th><th class="num">'+fmt(sum)+'</th></tr></tfoot></table>';}).join('');
 $('druck').innerHTML='<article class="sammel"><div class="head"><h1>Sammellieferschein W1</h1><div>Datum: '+dat+'</div></div>'+teile+'<p style="margin-top:14px"><strong>Gesamtmenge: '+fmt(gesamt)+'</strong></p></article>';
 window.print();setTimeout(()=>{$('druck').innerHTML='';},1000);}catch(e){await frage('Nicht möglich: '+(e.message||e),'OK');}});
$('finish').addEventListener('click',async()=>{if(!hasData)return;const list=window.w1LastData.positionen;
 if(!await frage(list.length+' Palette(n) = '+gruppen(list).size+' Lieferschein(e) im Format A5 werden jetzt gedruckt.','✓ JA, DRUCKEN','ZURÜCK'))return;
 $('finish').disabled=true;status('⏳ Lieferscheine werden erstellt …');
 try{const d=await call('w1VersandAbschliessen');await drucken(d.positionen||[]);await init();status('✓ Fertig. Nächster Begleitschein bitte.');}
 catch(e){status('');await frage('Abschließen nicht möglich: '+(e.message||e),'OK');}
 finally{$('finish').disabled=false;}});
$('reprint').addEventListener('click',async()=>{try{const d=await call('w1VersandLetzterAbschluss');await drucken(d.positionen||[]);}catch(e){await frage('Nicht möglich: '+(e.message||e),'OK');}});
init();
})();
</script>
<script>
/* W1 Kamera v3: Live-Bild, gezielte Kamerawahl (USB1.0), grösstmögliches Standbild, Anzeige der Fotogrösse. */
(()=>{'use strict';
const $=id=>document.getElementById(id);
const BEVORZUGT='USB1.0';
let stream=null,track=null,startet=false;
const alt=$('openCamera'),btn=alt.cloneNode(true);alt.replaceWith(btn);
const video=document.createElement('video');
video.autoplay=true;video.muted=true;video.playsInline=true;
video.style.cssText='display:none;width:100%;flex:1 1 auto;min-height:120px;max-height:48vh;background:#000;border-radius:14px;object-fit:contain';
btn.before(video);
const wahl=document.createElement('select');
wahl.style.cssText='display:none;min-height:38px;font:14px Arial;margin:6px 0';
btn.after(wahl);
const info=document.createElement('p');
info.style.cssText='font-size:14px;color:#546377;margin:2px 0;display:'+(/test/.test(location.hash)?'block':'none');
$('status').after(info);
if(/kamera/.test(location.hash))wahl.style.display='block';
if(/test/.test(location.hash)){
 const t=document.querySelector('.tech');if(t)t.style.setProperty('display','block','important');
 for(const id of ['timing','raw'])$(id).style.setProperty('display','block','important');
}
const meldung=t=>{$('status').textContent=t;};
function stoppen(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;video.style.display='none';}
async function oeffnen(id){
 const v={width:{ideal:4096},height:{ideal:2160}};
 if(id)v.deviceId={exact:id};
 stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
 track=stream.getVideoTracks()[0];
 video.srcObject=stream;video.style.display='block';await video.play();
 try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
}
async function starten(){
 if(startet)return;startet=true;
 try{
  stoppen();await oeffnen('');
  const liste=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  wahl.replaceChildren(...liste.map((d,i)=>new Option(d.label||('Kamera '+(i+1)),d.deviceId)));
  const gemerkt=localStorage.getItem('w1_kamera')||'';
  const ziel=liste.find(d=>d.deviceId===gemerkt)||liste.find(d=>/jourist|ds130|document|dokument/i.test(d.label))||liste.find(d=>d.label.includes(BEVORZUGT));
  if(ziel&&ziel.deviceId!==track.getSettings().deviceId){stoppen();await oeffnen(ziel.deviceId);}
  wahl.value=track.getSettings().deviceId;
 }catch(e){stoppen();meldung('Kamera konnte nicht gestartet werden ('+(e.name||'Fehler')+'). Bitte „Begleitschein-Bild auswählen“ nutzen.');}
 finally{startet=false;}
}
wahl.addEventListener('change',async()=>{
 localStorage.setItem('w1_kamera',wahl.value);stoppen();
 try{await oeffnen(wahl.value);}catch(e){meldung('Kamera konnte nicht gestartet werden.');}
});
function frist(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(Error('Zeit abgelaufen')),ms))]);}
async function foto(){
 if(window.ImageCapture){
  try{
   const b=await frist(new ImageCapture(track).takePhoto(),4000);
   if(b&&b.size>0)return {blob:b,art:'Standbild'};
  }catch(e){}
 }
 if(!video.videoWidth)return null;
 const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;
 c.getContext('2d').drawImage(video,0,0);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
 return b?{blob:b,art:'Videobild'}:null;
}
btn.addEventListener('click',async()=>{
 if(!track||track.readyState!=='live'){await starten();if(!track)return;}
 const res=await foto();
 if(!res){meldung('Foto konnte nicht erstellt werden. Bitte kurz warten und erneut drücken.');return;}
 try{const bmp=await createImageBitmap(res.blob);info.textContent='Foto: '+bmp.width+' × '+bmp.height+' Pixel ('+res.art+', '+Math.round(res.blob.size/1024)+' KB)';bmp.close();}catch(e){}
 const file=new File([res.blob],'W1_Begleitschein.jpg',{type:res.blob.type==='image/png'?'image/png':'image/jpeg'});
 const t=new DataTransfer();t.items.add(file);
 const eingabe=$('camera');eingabe.files=t.files;eingabe.dispatchEvent(new Event('change',{bubbles:true}));
});
starten();
})();
</script>
</body></html>
